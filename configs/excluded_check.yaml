# generated by experiments/make_excluded_check.py from experiment.yaml
seed: 0
repeats: 1
llm:
  defaults:
    backend: ucsd
    model: api-glm-5.3-flash
    temperature: 0.0
    max_tokens: 4096
  roles:
    researcher:
      model: api-glm-5.3-flash
      max_tokens: 12000
    planner:
      model: api-glm-5.3-flash
    executor:
      model: api-glm-5.3-flash
    verifier:
      model: api-glm-5.3
      max_tokens: 16000
environment:
  domain: course_enrollment
  restore_mode: realistic
  competitors: true
workflow:
  stages:
  - researcher
  - planner
  - executor
  tasks_file: data/tasks_excluded_check.json
  stage_timeout_s: 60
faults:
- id: none
  kind: none
- id: researcher-wrong-prereq
  kind: incorrect_result
  category: accidental
  stage: researcher
  params:
    type: wrong_prereq
- id: researcher-wrong-seats
  kind: incorrect_result
  category: accidental
  stage: researcher
  params:
    type: seats_full
- id: researcher-wrong-time
  kind: incorrect_result
  category: accidental
  stage: researcher
  params:
    type: time_shift
- id: researcher-wrong-units
  kind: incorrect_result
  category: accidental
  stage: researcher
  params:
    type: max_units
- id: researcher-stale-record
  kind: stale_output
  category: accidental
  stage: researcher
  params:
    type: stale_record
- id: researcher-timeout
  kind: timeout
  category: accidental
  stage: researcher
- id: researcher-injection
  kind: malicious_instruction
  category: adversarial
  stage: researcher
  params:
    type: notice
- id: planner-injection
  kind: malicious_instruction
  category: adversarial
  stage: planner
  params:
    type: plan_action
recovery:
  methods:
  - full_restart
  - full_restart_oracle
  - verify_all
  - verify_all_self
  verifier_tool_access: true
  oracle_fault_identity: true
output:
  results_dir: results/excluded_check
  traces_dir: results/excluded_check/traces
